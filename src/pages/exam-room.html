<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>غرفة الامتحان - مدرسة الألحان</title>
  <link rel="icon" href="../assets/images/cross (2).png">
  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="padding: 20px; background: var(--color-bg); color: var(--color-text);">

  <header class="site-header" style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; background: var(--color-surface); padding: 15px 20px; border-radius: 12px; border: 1px solid var(--color-border);">
    <h1><i class="fa-solid fa-pen-to-square" style="color: var(--color-primary);"></i> <span id="exam-title-header">جاري تحميل الامتحان...</span></h1>
    <a href="../../index.html" class="theme-toggle" style="text-decoration: none; padding: 8px 15px; background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 8px;"><i class="fa-solid fa-house"></i> الرئيسية</a>
  </header>

  <main style="max-width: 800px; margin: 0 auto; background: var(--color-surface); padding: 25px; border-radius: 12px; border: 1px solid var(--color-border);">
    <div id="exam-intro">
      <p id="exam-desc" style="font-size: 1.1rem; color: var(--color-text-muted);">برجاء الانتظار جاري جلب أسئلة الامتحان...</p>
    </div>

    <form id="exam-form" style="display: none; margin-top: 20px;">
      <div id="questions-container">
        <!-- سيتم حقن الأسئلة هنا ديناميكياً -->
      </div>
      <button type="submit" id="submit-exam-btn" style="margin-top: 20px; background: var(--color-primary); color: #fff; border: none; padding: 12px 25px; border-radius: 8px; font-size: 1rem; cursor: pointer; font-family: inherit; font-weight: bold; width: 100%;">
        تسليم الإجابات وإنهاء الامتحان
      </button>
    </form>

    <div id="exam-result-box" style="display: none; text-align: center; margin-top: 20px; padding: 20px;">
      <h2 style="color: var(--color-accent);"><i class="fa-solid fa-circle-check"></i> تم تسليم امتحانك بنجاح! 🎉</h2>
      <p id="score-summary" style="font-size: 1.1rem; margin: 15px 0;"></p>
      <p style="color: var(--color-text-muted); font-size: 0.95rem;">تم رصد درجات الأسئلة الاختيارية تلقائياً، والأسئلة المقالية في انتظار تصحيح الكنترول.</p>
      <a href="../../index.html" style="display: inline-block; margin-top: 20px; padding: 10px 25px; background: var(--color-primary); color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold;">العودة للرئيسية</a>
    </div>
  </main>

  <script type="module" src="exam-room.js"></script>
</body>
</html>
