<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استكمال البيانات - مدرسة الألحان</title>
  <link rel="icon" href="/assets/images/cross (2).png">
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="stylesheet" href="/src/pages/signup.css">
</head>
<body>

  <header class="site-header">
    <button class="theme-toggle" id="theme-toggle">🌙 داكن</button>
    <div style="display:flex; align-items:center; gap:10px;">
      <h1>مدرسة الألحان والخدمة</h1>
      <img src="/assets/images/archangel-michael.jpg" alt="شعار الكنيسة" class="logo">
    </div>
  </header>

  <main class="auth-page">
    <form id="complete-profile-form" class="auth-form">
      <h2>أهلاً بيك! برجاء استكمال بيانات حسابك</h2>
      <p style="text-align: center; color: var(--text-muted, #666); font-size: 0.9rem; margin-bottom: 20px;">
        خطوة واحدة وتكون جاهز لاستخدام المنصة
      </p>

      <label for="fullName">الاسم الثلاثي</label>
      <input type="text" id="fullName" required placeholder="اكتب اسمك الثلاثي">

      <label for="whatsapp">رقم الواتساب</label>
      <input type="tel" id="whatsapp" required maxlength="11" placeholder="01xxxxxxxxx" pattern="^(010|011|012|015)[0-9]{8}$">

      <label for="accountType">نوع الحساب</label>
      <select id="accountType" required>
        <option value="" disabled selected>اختر النوع</option>
        <option value="student">طالب</option>
        <option value="servant">خادم</option>
      </select>

      <div id="student-fields" class="conditional-fields hidden">
        <label for="studentGrade">المرحلة الدراسية</label>
        <select id="studentGrade">
          <option value="" disabled selected>اختر المرحلة</option>
          <option value="kindergarten">حضانة</option>
          <option value="primary_1_3">ابتدائي (1-3)</option>
          <option value="primary_4_6">ابتدائي (4-6)</option>
          <option value="preparatory">إعدادي</option>
        </select>
      </div>

      <div id="servant-fields" class="conditional-fields hidden">
        <label>المراحل المسؤول عنها</label>
        <div class="checkbox-group" style="display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px;">
          <label><input type="checkbox" name="servantGrade" value="kindergarten"> حضانة</label>
          <label><input type="checkbox" name="servantGrade" value="primary_1_3"> ابتدائي (1-3)</label>
          <label><input type="checkbox" name="servantGrade" value="primary_4_6"> ابتدائي (4-6)</label>
          <label><input type="checkbox" name="servantGrade" value="preparatory"> إعدادي</label>
        </div>

        <label for="servantSubject">المادة</label>
        <select id="servantSubject">
          <option value="" disabled selected>اختر المادة</option>
          <option value="coptic">قبطي</option>
          <option value="rite">طقس</option>
          <option value="bible">دراسة الكتاب</option>
          <option value="hymns">ألحان</option>
        </select>

        <!-- كود التحقق للخدام -->
        <label for="servantCode" style="margin-top: 15px;">ادخل كود الخادم العادي</label>
        <input type="password" id="servantCode" placeholder="الكود السري">

        <!-- اختيار خادم مشرف -->
        <div style="margin-top: 15px; margin-bottom: 10px;">
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.95rem;">
            <input type="checkbox" id="isSupervisorCheck"> هل تريد أن تكون خادم مشرف؟
          </label>
        </div>

        <div id="supervisor-code-group" class="hidden" style="margin-top: 10px;">
          <label for="supervisorCode">ادخل كود الخادم المشرف</label>
          <input type="password" id="supervisorCode" placeholder="الكود السري للمشرفين">
        </div>
      </div>

      <p id="error-msg" class="error hidden"></p>

      <button type="submit">حفظ ودخول</button>
    </form>
  </main>

  <script src="/src/theme.js"></script>

  <!-- 1. سكريبت واجهة المستخدم -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const accountType = document.getElementById("accountType");
      const studentFields = document.getElementById("student-fields");
      const servantFields = document.getElementById("servant-fields");
      const whatsappInput = document.getElementById("whatsapp");
      const isSupervisorCheck = document.getElementById("isSupervisorCheck");
      const supervisorCodeGroup = document.getElementById("supervisor-code-group");

      function updateUI() {
        const val = accountType.value;
        if (val === "student") {
          studentFields.classList.remove("hidden");
          servantFields.classList.add("hidden");
        } else if (val === "servant") {
          studentFields.classList.add("hidden");
          servantFields.classList.remove("hidden");
        } else {
          studentFields.classList.add("hidden");
          servantFields.classList.add("hidden");
        }
      }

      accountType.addEventListener("change", updateUI);
      updateUI();

      if (isSupervisorCheck && supervisorCodeGroup) {
        isSupervisorCheck.addEventListener("change", () => {
          supervisorCodeGroup.classList.toggle("hidden", !isSupervisorCheck.checked);
        });
      }

      if (whatsappInput) {
        whatsappInput.addEventListener("input", (e) => {
          let val = e.target.value.replace(/\D/g, "");
          if (val.length > 11) val = val.slice(0, 11);
          e.target.value = val;
        });
      }
    });
  </script>

  <!-- 2. سكريبت الفايربيز -->
  <script type="module">
    import { auth, db } from "/src/config/firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const form = document.getElementById("complete-profile-form");
    const accountType = document.getElementById("accountType");
    const errorMsg = document.getElementById("error-msg");
    const fullNameInput = document.getElementById("fullName");
    const whatsappInput = document.getElementById("whatsapp");

    let currentUser = null;

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        if (user.displayName && !fullNameInput.value) {
          fullNameInput.value = user.displayName;
        }
        
        const userRef = doc(db, "users", user.uid);
        const snap = await getDoc(userRef);
        if (snap.exists() && snap.data().profileComplete !== false) {
          redirectAfterLogin(snap.data().accountType);
        }
      } else {
        window.location.href = "/login";
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.classList.add("hidden");

      if (!currentUser) {
        return showError("جاري التأكد من بيانات الحساب، برجاء الانتظار ثوانٍ ثم الضغط مرة أخرى.");
      }

      const fullName = fullNameInput.value.trim();
      const whatsapp = whatsappInput.value.trim();

      const whatsappRegex = /^(010|011|012|015)\d{8}$/;
      if (!whatsappRegex.test(whatsapp)) {
        return showError("رقم الواتساب غير صحيح! يجب أن يبدأ بـ 010, 011, 012 أو 015 ويتكون من 11 رقماً");
      }

      const type = accountType.value;
      if (!type) return showError("من فضلك اختر نوع الحساب");

      let profileData = {
        fullName,
        whatsapp,
        email: currentUser.email || "",
        accountType: type,
        profileComplete: true,
        createdAt: new Date().toISOString()
      };

      if (type === "student") {
        const grade = document.getElementById("studentGrade").value;
        if (!grade) return showError("من فضلك اختر المرحلة الدراسية");
        profileData.grade = grade;
        profileData.classId = grade;
        profileData.points = 0;
        profileData.level = 1;
        profileData.attendanceRate = 0;
        profileData.status = "pending";
        profileData.isSupervisor = false;
      }

      if (type === "servant") {
        const grades = Array.from(
          document.querySelectorAll('input[name="servantGrade"]:checked')
        ).map(cb => cb.value);
        const subject = document.getElementById("servantSubject").value;
        const servantCodeInput = document.getElementById("servantCode").value.trim();
        const isSupervisorCheck = document.getElementById("isSupervisorCheck");
        const isSupervisorChoice = isSupervisorCheck ? isSupervisorCheck.checked : false;

        if (grades.length === 0) return showError("اختر مرحلة واحدة على الأقل");
        if (!subject) return showError("اختر المادة");
        if (!servantCodeInput) return showError("من فضلك أدخل كود التحقق الخاص بالخدام");

        let isSupervisor = false;

        try {
          const configRef = doc(db, "settings", "config");
          const configSnap = await getDoc(configRef);

          if (!configSnap.exists()) {
            return showError("خطأ في إعدادات النظام، تواصل مع المسؤول");
          }

          const configData = configSnap.data();
          const correctServantCode = configData.servantSecretCode || configData.servantCode;

          if (servantCodeInput !== correctServantCode) {
            return showError("كود التحقق الخاص بالخدام غير صحيح!");
          }

          if (isSupervisorChoice) {
            const supervisorCodeInput = document.getElementById("supervisorCode").value.trim();
            if (!supervisorCodeInput) {
              return showError("من فضلك أدخل كود التحقق الخاص بالخادم المشرف");
            }
            const correctSupervisorCode = configData.supervisorSecretCode || configData.supervisorCode;
            if (supervisorCodeInput !== correctSupervisorCode) {
              return showError("كود التحقق الخاص بالخادم المشرف غير صحيح!");
            }
            isSupervisor = true;
          }
        } catch (err) {
          console.error("Fetch Config Error:", err);
          return showError("حدث خطأ أثناء التحقق من الكود");
        }

        profileData.grades = grades;
        profileData.subject = subject;
        profileData.status = "approved";
        profileData.isSupervisor = isSupervisor;
      }

      try {
        await setDoc(doc(db, "users", currentUser.uid), profileData, { merge: true });
        
        if (type === "student") {
          alert("تم حفظ بياناتك بنجاح! حسابك الآن قيد المراجعة بواسطة الخدام المشرفين ولن تتمكن من الدخول حتى يتم الموافقة عليه.");
          await signOut(auth);
          window.location.href = "/login";
        } else {
          window.location.href = "/servant-dashboard";
        }
      } catch (err) {
        console.error("Save User Error:", err);
        showError("حدث خطأ أثناء حفظ البيانات، حاول مرة أخرى.");
      }
    });

    function redirectAfterLogin(type) {
      window.location.href = type === "servant"
        ? "/servant-dashboard"
        : "/";
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.remove("hidden");
    }
  </script>
</body>
</html>
