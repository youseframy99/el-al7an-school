<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب - مدرسة الألحان</title>
  <link rel="icon" href="/assets/images/cross (2).png">
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="stylesheet" href="/src/pages/signup.css">
</head>
<body>

  <header class="site-header">
    <button class="theme-toggle" id="theme-toggle">🌙 داكن</button>
  <div style="display:flex; align-items:center; gap:10px;">
    <img src="../../assets/images/archangel-michael.jpg" alt="شعار الكنيسة" class="logo">
    <h1>مدرسة الألحان والخدمة</h1>
  </div>
  </header>

  <main class="auth-page">

    <div class="social-buttons">
      <button type="button" id="google-btn" class="social-btn google">
  <svg width="18" height="18" viewBox="0 0 48 48">
    <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.5 29.6 3.5 24 3.5 12.7 3.5 3.5 12.7 3.5 24S12.7 44.5 24 44.5 44.5 35.3 44.5 24c0-1.2-.1-2.4-.9-3.5z"/>
    <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.5 29.6 3.5 24 3.5 16 3.5 9 8 6.3 14.7z"/>
    <path fill="#4CAF50" d="M24 44.5c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.5 35.6 26.9 36.5 24 36.5c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9 40.5 16 44.5 24 44.5z"/>
    <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.7l6.6 5.4C41.4 36.4 44.5 30.8 44.5 24c0-1.2-.1-2.4-.9-3.5z"/>
  </svg>
  الدخول بحساب جوجل
</button>

<button type="button" id="facebook-btn" class="social-btn facebook">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2">
    <path d="M22 12c0-5.5-4.5-10-10-10S2 6.5 2 12c0 5 3.7 9.1 8.4 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7C18.3 21.1 22 17 22 12z"/>
  </svg>
  الدخول بحساب فيسبوك
</button>
    </div>

    <div class="divider"><span>أو</span></div>

    <form id="signup-form" class="auth-form">
      <h2>إنشاء حساب بالإيميل</h2>

      <label for="fullName">الاسم الثلاثي</label>
      <input type="text" id="fullName" required>

      <label for="whatsapp">رقم الواتساب</label>
      <input type="tel" id="whatsapp" required>

      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" required>

      <label for="password">كلمة المرور</label>
<input type="password" id="password" required minlength="6">

<label for="confirmPassword">تأكيد كلمة المرور</label>
<input type="password" id="confirmPassword" required minlength="6">
      <label for="accountType">نوع الحساب</label>
      <select id="accountType" required>
        <option value="" disabled selected>اختر النوع</option>
        <option value="student">طالب</option>
        <option value="servant">خادم</option>
      </select>

      <div id="student-fields" class="conditional-fields hidden">
        <label for="studentGrade">المرحلة الدراسية</label>
        <select id="studentGrade">
          <option value="" disabled selected>اختر المرحلة</option>
          <option value="kindergarten">حضانة</option>
          <option value="primary_1_3">ابتدائي (1-3)</option>
          <option value="primary_4_6">ابتدائي (4-6)</option>
          <option value="preparatory">إعدادي</option>
        </select>
      </div>

      <div id="servant-fields" class="conditional-fields hidden">
        <label>المراحل المسؤول عنها</label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="servantGrade" value="kindergarten"> حضانة</label>
          <label><input type="checkbox" name="servantGrade" value="primary_1_3"> ابتدائي (1-3)</label>
          <label><input type="checkbox" name="servantGrade" value="primary_4_6"> ابتدائي (4-6)</label>
          <label><input type="checkbox" name="servantGrade" value="preparatory"> إعدادي</label>
        </div>

        <label for="servantSubject">المادة</label>
        <select id="servantSubject">
          <option value="" disabled selected>اختر المادة</option>
          <option value="coptic">قبطي</option>
          <option value="rite">طقس</option>
          <option value="bible">دراسة الكتاب</option>
          <option value="hymns">ألحان</option>
        </select>
      </div>

      <p id="error-msg" class="error hidden"></p>

      <button type="submit">إنشاء الحساب</button>
      <p class="switch-link">عندك حساب؟ <a href="/login">تسجيل الدخول</a></p>
    </form>
  </main>

  <script src="/src/theme.js"></script>
  <script type="module" src="/src/pages/signup.js"></script>
</body>
</html>
